<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="0.5" stop-color="#120f24"/>
      <stop offset="1" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#b366ff"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="20" fill="url(#bg)" stroke="#30363d"/>
  <rect x="1" y="1" width="1198" height="298" rx="20" stroke="url(#edge)" stroke-opacity="0.7"/>

  <circle cx="30" cy="30" r="7" fill="#ff5f56"/>
  <circle cx="54" cy="30" r="7" fill="#ffbd2e"/>
  <circle cx="78" cy="30" r="7" fill="#27c93f"/>
  <text x="600" y="35" fill="#6e7681" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" text-anchor="middle">ametistovv@github — zsh — 120×30</text>
  <line x1="1" y1="54" x2="1199" y2="54" stroke="#21262d"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17">
    <text x="40" y="108" fill="#56d364">ametistovv@github</text>
    <text x="222" y="108" fill="#8b949e">:~$</text>
    <text x="330" y="108" fill="#f0e6ff">whoami</text>

    <text x="40" y="146" fill="#c792ea" font-size="16">python-dev · telegram bots · web · games · rust</text>

